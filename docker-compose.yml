services:
  subscription-service:
    container_name: subscription-service
    build: .
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ${ENV_COMMON_PATH:-../../config/.env.common}
      - .env.staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "4003:4003"
    volumes:
      - ../../logs:/var/log/projectshell
    restart: always
    networks:
      - gateway_app-net

networks:
  gateway_app-net:
    external: true
